[uwsgi]
socket = [::]:3031
chdir = /usr/src/app/
wsgi-file = api/wsgi.py
processes = 128  # make sure to adjust nginx workers and dbapi max_connections
threads = 1
# accept backlog for requests waiting on a free worker; must hold the queue nginx allows
# (max_conns in /www/conf/nginx.conf minus processes) plus Prometheus scrapes via the http router
# below. uwsgi refuses to start if this exceeds net.core.somaxconn (4096 by default since Linux 5.4).
listen = 1536
uid = nobody
gid = nogroup
#stats = 127.0.0.1:9191

#master = true
http = [::]:8080
http-to = 127.0.0.1:3031
env = prometheus_multiproc_dir=/var/local/django_metrics
